name: Test pack with help args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare environment for action
        shell: bash
        run: |
          set +e
          mkdir -p "${HOME}/bin"
          # Stub files that the action's cleanup step will try to remove.
          # setup-pack installs these; if it fails they won't exist and rm will error.
          touch "${HOME}/bin/jq"
          touch "${HOME}/bin/crane"
          touch "${HOME}/bin/yj"
          echo "${HOME}/bin" >> "$GITHUB_PATH"
          exit 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          args: build --help
          version: '0.33.2'

      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded running 'pack build --help'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (setup-pack or network issue under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' (expected success or failure)"
            exit 1
          fi
